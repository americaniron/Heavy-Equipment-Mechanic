name = "fixmyiron-api-prod"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
account_id = "1c07214c662a877a6d09d597d5f4a461"

# Custom domain — Cloudflare auto-creates the DNS record and provisions the
# edge SSL cert when this is set. workers_dev stays true as a fallback URL.
[[routes]]
pattern = "api.fixmyiron.com"
custom_domain = true

# Plain (non-secret) vars
[vars]
APP_ENV = "production"
PADDLE_ENVIRONMENT = "sandbox"
CLERK_ACCOUNT_PORTAL_URL = "https://www.fixmyiron.com/login"
WEB_ORIGIN = "https://fixmyiron.com,https://www.fixmyiron.com,https://portal.fixmyiron.com,https://americanironus.com,https://www.americanironus.com"
PUBLIC_BASE_URL = "https://www.fixmyiron.com"
# Preserved from the live Worker so a wrangler deploy does not drop
# quote/portal bindings that exist outside this git tree.
AMERICAN_IRON_STRIPE_ACCOUNT_ID = "acct_1TftJkBc82C72bPu"
PORTAL_DISCOUNT_BPS = "0"
PORTAL_SHIPPING_RATE_CENTS_PER_POUND = "300"
PORTAL_STRIPE_FORCE_STANDARD_HOST = "true"
PORTAL_TAX_RATE_BPS = "0"

# D1 — relational database (PROD)
[[d1_databases]]
binding = "DB"
database_name = "fixmyiron-prod"
database_id = "16bb71a1-f57f-4e37-bf12-d2f74a693aca"
migrations_dir = "../../migrations"

# KV — Paddle webhook idempotency (7d TTL writes)
[[kv_namespaces]]
binding = "PADDLE_EVENTS_SEEN"
id = "4227f5619ed64ceba2490b400143a476"

# KV — per-user Anthropic rate limit
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "8c60c2ca218d4c4c97700a41541a8bfa"

# KV — sessions / lightweight cache  
[[kv_namespaces]]
binding = "SESSIONS"
id = "1174c6d5f01e439789f3a28d42453f26"

# Using SESSIONS for auth tokens too (workaround - no separate AUTH_KV)
[[kv_namespaces]]
binding = "AUTH_KV"
id = "1174c6d5f01e439789f3a28d42453f26"

[[send_email]]
name = "EMAIL"

# R2 — PDFs, audio, uploaded photos. Bucket created at cutover; no
# product surface writes here yet (PDF export still DEFERRED). Binding
# is wired so re-enabling is a code-only change.
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "fixmyiron-assets-prod"

# Second binding on the same bucket — present on the live Worker.
# Keep the name so deploy does not delete it.
[[r2_buckets]]
binding = "PORTAL_ASSETS"
bucket_name = "fixmyiron-assets-prod"

# Durable Object — per-customer diagnostic sessions
[[durable_objects.bindings]]
name = "DIAGNOSTIC_SESSION"
class_name = "DiagnosticSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DiagnosticSession"]

# Observability
[observability]
enabled = true

# Cron triggers are disabled on this account (5-cron cap). Re-enable only
# after freeing a slot and restoring a scheduled handler in src/index.ts.
