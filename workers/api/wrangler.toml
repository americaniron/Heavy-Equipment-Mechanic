name = "fixmyiron-api-staging"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Plain (non-secret) vars
[vars]
PADDLE_ENVIRONMENT = "sandbox"
CLERK_ACCOUNT_PORTAL_URL = "https://accounts.fixmyiron.com"
WEB_ORIGIN = ""

# D1 — relational database
[[d1_databases]]
binding = "DB"
database_name = "fixmyiron-staging"
database_id = "REPLACE_WITH_D1_ID_AFTER_CREATE"
migrations_dir = "../../migrations"

# KV — Paddle webhook idempotency (7d TTL writes)
[[kv_namespaces]]
binding = "PADDLE_EVENTS_SEEN"
id = "REPLACE_WITH_KV_ID_AFTER_CREATE"

# KV — per-user Anthropic rate limit
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "REPLACE_WITH_KV_ID_AFTER_CREATE"

# KV — sessions / lightweight cache
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_ID_AFTER_CREATE"

# R2 — PDFs, audio, uploaded photos
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "fixmyiron-assets-staging"

# Queue — async jobs (enrichment, email, fault-code refresh)
[[queues.producers]]
binding = "JOBS"
queue = "fixmyiron-jobs-staging"

# Durable Object — per-customer diagnostic sessions
[[durable_objects.bindings]]
name = "DIAGNOSTIC_SESSION"
class_name = "DiagnosticSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DiagnosticSession"]

# Observability
[observability]
enabled = true

# Cron triggers (used by future fault-code refresh in next slice; declared empty for now)
# [triggers]
# crons = ["0 6 * * 0"]  # weekly Sun 06:00 UTC — uncomment when consumer lands
