name = "fixmyiron-api-staging"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
account_id = "1c07214c662a877a6d09d597d5f4a461"

# Plain (non-secret) vars
[vars]
APP_ENV = "staging"
PADDLE_ENVIRONMENT = "sandbox"
CLERK_ACCOUNT_PORTAL_URL = "https://www.fixmyiron.com/login"
WEB_ORIGIN = "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:3000,https://fixmyiron-web-staging.americanironadmin.workers.dev,https://fixmyiron-hem-git.pages.dev"

# D1 — relational database
[[d1_databases]]
binding = "DB"
database_name = "fixmyiron-staging"
database_id = "74ce90d6-d3f7-4431-8743-804dd3b6d371"
migrations_dir = "../../migrations"

# KV — Paddle webhook idempotency (7d TTL writes)
[[kv_namespaces]]
binding = "PADDLE_EVENTS_SEEN"
id = "1cf3e33f79e74cb0a0b2bb082be2ba21"

# KV — per-user Anthropic rate limit
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "4129b00bc060470aa21ad460e5058aa2"

# KV — sessions / lightweight cache
[[kv_namespaces]]
binding = "SESSIONS"
id = "388a24b3ecc14909b7e63d73bc4fbbf7"

# KV — auth tokens (JWT replacement)
[[kv_namespaces]]
binding = "AUTH_KV"
id = "367342e6ab684242be922dc69e425917"

[[send_email]]
name = "EMAIL"

# R2 — PDFs, audio, uploaded photos.
# DISABLED for staging: the current OAuth token lacks the r2 scope.
# Re-enable after `wrangler login` with R2 included, or use an API token
# with `Workers R2 Storage Edit` permission. Foundation slice does not
# touch R2; the binding will be wired when product surfaces need it.
# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "fixmyiron-assets-staging"

# Queue — async jobs (enrichment, email, fault-code refresh)
[[queues.producers]]
binding = "JOBS"
queue = "fixmyiron-jobs-staging"

# Durable Object — per-customer diagnostic sessions
[[durable_objects.bindings]]
name = "DIAGNOSTIC_SESSION"
class_name = "DiagnosticSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DiagnosticSession"]

# Observability
[observability]
enabled = true

# Cron triggers — currently DISABLED because the Cloudflare account has
# already hit the 5-cron-trigger account-wide cap. The scheduled()
# handler in src/index.ts and the JOBS queue-producer binding stay
# wired so re-enabling is a one-line change once the quota is bumped
# (or another cron is freed up). When re-enabled, the cron is:
#   weekly Sunday 06:00 UTC, enqueues a fault_code_refresh job.
# [triggers]
# crons = ["0 6 * * SUN"]
